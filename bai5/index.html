<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .khoi-1{
                color: blue;
                background-color: yellow;
            }
            h2{
                color: red;
                background-color: green;

            /* margin truyền 1 giá trị thì sẽ cách xung quanh = giá trị đó */
            /* 2 giá trị: giá trị đầu (trên dưới), giá trị 2 (trái phải) */
            /* 4 giá trị: trên, phải, dưới, trái */
                margin: 100px 50px 100px 50px;

            }
            h3{
                color: aqua;
                background-color: yellow;

                padding: 50px 100px 50px 100px;
                /* justify-content luôn luôn đi với display: flex(chiều ngang) */
                /* align-content luôn luôn đi với display: flex(chiều dọc) */

            }

        </style>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <h1 style ="color:aqua; background-color: yellow">BTL</h1>
        <!-- Nếu là id sử dụng dấu # + tên id -->
         <!-- ví dụ ở dưới: #tieude-1 -->
        <h2> <id="tieude-1"> do duy trong </h2>
         <!-- Nếu là class sử dụng dấu . + tên class -->
           <!-- ví dụ ở dưới: .tieude-2 -->
        <h3> <class="tieude-2">humg </h3>

        <div>web4</div>
        <div class="web4">web4</div>

        </div>
             
    </body>
</html>
