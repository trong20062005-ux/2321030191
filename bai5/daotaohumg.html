<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đao tao humg</title>
    <style>
        .menu {
            background-color: #2fa4e7;
        }

        .danh-sach-muc {
            /* bỏ dấu chấm của list  */
            list-style: none;
            margin: auto;
            display: flex;
        }

        .muc {
            color: white;
            /* bsckground-color: red; */
            padding: 15px;
                /* font-weght: blod; */
        }

        a {
            /* để bỏ gạch chân dùng text-decoration */
            text-decoration: none;
            color: white;
        }

        main {
            display: flex;
        }

        .khoi-trai {
            background-color: blue;
            width: 20%;
            height: 500px;
        }

        .khoi-phai {
            background-color: green;
            width: 80%;
            height: 500px;
        }
    </style>
</head>

<body>
    <!-- Thanh Menu -->
    <nav class="menu">
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#">Thực tập, Đồ án</a></li>
            <li class="muc"><a href="#">Thủ tục một cửa</a></li>
            <li class="muc"><a href="#">Một cửa online</a></li>
            <li class="muc"><a href="#">E-mail HUMG</a></li>
        </ul>
    </nav>
    <!-- nội dung chính -->
    <main>
        <div class="khoi trai">Trái </div>
        <div>
            <p>đây là nội dung của khối trái</p>
        </div>
        <div class="khoi phai">Phải</div>
    </main>
</body>


</html>
